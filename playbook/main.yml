- name: "Créer l'user toto sur srv-ansible"
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: "Création de l'user toto avec mot de passe et clefs SSH"
      ansible.builtin.user:
        name: toto
        password: "{{ '@Partage123' | password_hash('sha512') }}"
        update_password: on_create
        generate_ssh_key: true
        ssh_key_type: ed25519

- name: "Configurer les serveurs"
  hosts: all
  become: true
  roles:
    - secure_ssh_bind
    - admin_user